plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0-M2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'de.oberamsystems'
version = '0.0.1-SNAPSHOT'
description = 'service monitoring software'
compileJava.options.encoding = 'UTF-8'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	//implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation("org.thymeleaf:thymeleaf:3.1.5.RELEASE")
	implementation 'org.webjars:bootstrap:5.3.7'
	implementation 'org.postgresql:postgresql'
	implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
	//implementation 'ch.qos.logback:logback-core:1.5.18'
	implementation 'org.hibernate.orm:hibernate-core:7.4.13.Final'
	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26' // fixes a CVE
	implementation 'tools.jackson.core:jackson-databind:3.2.3' // fixes a CVE
	implementation 'org.apache.commons:commons-lang3:3.21.0' // fixes a CVE
	runtimeOnly 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	//testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:unchecked']
}

task getDeps(type: Copy) {
  from sourceSets.main.runtimeClasspath
  into 'runtime/'
}
